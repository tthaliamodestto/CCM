<!doctype html>
<html lang="pt-BR" data-theme="dark"><head><meta charset="utf-8"><title>Motor elétrico 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg1:#26364e;--bg2:#101927;--pn:#19263a;--tx:#f3f5f8;--mu:#aab6c6;--ln:#35445b;--ac:#aa8e52;--bl:#8fa2bc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg1:#26364e;--bg2:#101927;--pn:#19263a;--tx:#f3f5f8;--mu:#aab6c6;--ln:#35445b;--ac:#aa8e52;--bl:#8fa2bc;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--pn);color:var(--tx);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif}
#app{display:grid;grid-template-columns:1fr 360px;height:100%}
#stage{position:relative;min-height:0;background:radial-gradient(ellipse at 50% 42%,var(--bg1),var(--bg2));touch-action:none}
canvas{display:block;width:100%;height:100%;cursor:grab}
#panel{overflow:auto;padding:20px 22px 28px;border-left:1px solid var(--ln);display:flex;flex-direction:column;gap:22px}
h1{font-size:21px;line-height:1.2;margin:0 0 6px}h2{font-size:17px;margin:0 0 6px}
p{margin:0;color:var(--mu)}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:1px solid var(--ln);background:transparent;color:var(--tx);border-radius:8px;padding:8px 14px}
button:hover{border-color:var(--ac)}button.pri{background:var(--ac);border-color:var(--ac);color:#101927;font-weight:600}
:focus-visible{outline:2px solid var(--bl);outline-offset:2px}
label.rg{display:block;margin-top:14px;font-size:14px;color:var(--mu)}label.rg b{float:right;color:var(--tx);font-weight:600}
input[type=range]{width:100%;accent-color:var(--ac);margin:6px 0 0}
.chip input{position:absolute;opacity:0}.chip span{display:inline-block;padding:6px 12px;border:1px solid var(--ln);border-radius:99px;font-size:13.5px;cursor:pointer;margin:0 6px 8px 0}
.chip input:checked+span{background:var(--bl);border-color:var(--bl);color:#fff}.chip input:focus-visible+span{outline:2px solid var(--bl);outline-offset:2px}
dl{margin:12px 0 0}dt{font-size:13px;color:var(--mu)}dd{margin:0 0 10px}
#list{display:flex;flex-wrap:wrap;gap:6px}#list button{padding:5px 11px;font-size:13.5px;border-radius:99px}#list button.on{background:var(--tx);color:var(--pn);border-color:var(--tx)}
@media (max-width:820px){#app{grid-template-columns:1fr;grid-template-rows:50% 50%}#panel{border-left:0;border-top:1px solid var(--ln)}}
</style></head><body>
<div id="app"><main id="stage"><canvas id="c" aria-label="Motor elétrico em 3D"></canvas></main>
<aside id="panel">
<header><h1>Motor elétrico trifásico</h1><p>Arraste para girar, role para aproximar e toque em uma peça para conhecê-la.</p></header>
<section id="info"></section>
<section>
<div class="row"><button id="pw" class="pri">Desligar</button><button id="all">Ver tudo</button></div>
<label class="rg">Rotação <b id="rpmv">0 rpm</b><input id="rpm" type="range" min="0" max="1750" value="1200"></label>
<label class="rg">Vista explodida<input id="ex" type="range" min="0" max="100" value="0"></label>
<div style="margin-top:16px">
<label class="chip"><input type="checkbox" id="tCut"><span>Corte</span></label><label class="chip"><input type="checkbox" id="tField"><span>Campo magnético</span></label><label class="chip"><input type="checkbox" id="tIso" checked><span>Isolar peça</span></label><label class="chip"><input type="checkbox" id="tSlow"><span>Câmera lenta</span></label><label class="chip"><input type="checkbox" id="tAuto"><span>Girar câmera</span></label><label class="chip"><input type="checkbox" id="tRev"><span>Inverter sentido</span></label></div>
</section>
<section><h2>Peças</h2><div id="list"></div></section>
</aside></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

frontbell:{n:"Tampa dianteira",f:"Fecha o lado do acionamento e fixa o rolamento que suporta a carga da polia.",m:"Ferro fundido",c:"O retentor de borracha impede a entrada de pó e a saída de graxa."},
rearbell:{n:"Tampa traseira",f:"Fecha o lado oposto, apoia o segundo rolamento e recebe a tampa do ventilador.",m:"Ferro fundido",c:"As nervuras reforçam a região do rolamento sem aumentar muito o peso."},
bearings:{n:"Rolamentos",f:"Mantêm o eixo centrado e deixam o rotor girar com pouco atrito, sem tocar o estator.",m:"Aço-cromo com esferas e gaiola",c:"O entreferro entre rotor e estator tem menos de 1 mm. Rolamento gasto faz o rotor raspar."},

const cv=$("#c"),stage=$("#stage"),R=new T.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;R.toneMapping=T.ACESFilmicToneMapping;R.toneMappingExposure=1.15;R.localClippingEnabled=true;

[[0,12,0,14,1,14],[10,2,6,1,8,10],[-10,3,-6,1,8,10],[0,3,-12,14,6,1]].forEach(a=>{const m=new T.Mesh(new T.BoxGeometry(a[3],a[4],a[5]),new T.MeshBasicMaterial({color:new T.Color(1,1,1).multiplyScalar(5)}));m.position.set(a[0],a[1],a[2]);es.add(m)});
S.environment=new T.PMREMGenerator(R).fromScene(es).texture;
S.add(new T.HemisphereLight(0xbfd4ff,0x1a1d24,.3));
const kl=new T.DirectionalLight(0xffffff,1.6);kl.position.set(5,9,6);kl.castShadow=true;kl.shadow.mapSize.set(2048,2048);Object.assign(kl.shadow.camera,{left:-8,right:8,top:8,bottom:-8});kl.shadow.bias=-.0006;S.add(kl);
const fl=new T.DirectionalLight(0xa8c4ff,.6);fl.position.set(-6,3,-5);S.add(fl);
const cut=new T.Plane(new T.Vector3(0,0,-1),1e3),motor=new T.Group();S.add(motor);

// eixo
let g=G(),m=M(0xcfd6dd,1,.18);g.add(at(cylX(.16,.16,5.25,40,m),.275,0,0));[1.6,-1.6].forEach(x=>g.add(at(cylX(.25,.25,.3,40,m),x,0,0)));g.add(at(bx(.7,.06,.1,M(0xaab3bc,1,.3)),2.55,.17,0));reg("shaft",g);spinners.push(g);

for(let i=0;i<20;i++){const p=piv(i*PI/10);p.add(at(bx(2.1,.1,.12,al),0,.82,0));g.add(p)}

for(let i=0;i<12;i++){const p=piv(i*PI/6);p.add(at(bx(1.9,.17,.1,M(0x2a3038,.3,.8)),0,.97,0));g.add(p)}reg("stator",g);

// carcaça

for(let i=0;i<28;i++){const p=piv(i*PI/14);p.add(at(bx(2.5,.2,.07,m),0,1.72,0));g.add(p)}

for(let i=0;i<8;i++){const p=piv(i*PI/4);p.add(at(bx(.2,.64,.06,m),s*1.72,.95,0));g.add(p)}
bolts(s*1.68,dm,g);if(s>0)g.add(at(ring(.37,.17,.05,M(0x14181d,.1,.7)),1.86,0,0));reg(id,g,s>0?2.6:-2.2)}

// rolamentos
[1.6,-1.6].forEach((x,k)=>{g=G();const sm=M(0xd5dbe1,1,.2),bm=M(0xeef1f4,1,.12);g.add(ring(.365,.25,.28,sm));const cg=G();for(let i=0;i<9;i++){const p=piv(i*2*PI/9);p.add(at(new T.Mesh(new T.SphereGeometry(.057,16,12),bm),0,.3075,0));cg.add(p)}g.add(cg);g.position.x=x;cages.push(cg);reg("bearings",g,k?-1.7:1.7)});

g=G();m=M(0x174c8c,.5,.5);g.add(at(ring(1.55,1.49,.95,m),-2.18,0,0));g.add(at(ring(1.62,1.49,.08,m),-1.72,0,0));
[1.5,1.15,.8,.45].forEach(r=>g.add(at(ring(r+.03,r-.03,.05,m,48),-2.62,0,0)));
for(let i=0;i<16;i++){const p=piv(i*PI/8);p.add(at(bx(.05,1.25,.05,m),-2.62,.85,0));g.add(p)}reg("fancover",g,-4.4);
// ventilador
g=G();m=M(0x1f252c,.2,.55);g.add(at(cylX(.32,.32,.22,32,m),-2,0,0));g.add(at(ring(1.0,.3,.04,m),-1.92,0,0));
for(let i=0;i<10;i++){const p=piv(i*PI/5),b=bx(.22,.62,.04,m);b.rotation.y=.6;p.add(at(b,-2.0,.72,0));g.add(p)}reg("fan",g,-3.2);spinners.push(g);
// caixa de ligação
g=G();m=M(0x2c343d,.6,.5);g.add(at(bx(1.1,.1,.9,m),-.1,1.87,0));g.add(at(bx(1,.5,.8,m),-.1,2.17,0));g.add(at(bx(1.1,.08,.9,M(0x3a444f,.6,.45)),-.1,2.46,0));
for(const sx of[-1,1])for(const sz of[-1,1])g.add(at(new T.Mesh(new T.CylinderGeometry(.05,.05,.06,6),M(0x9aa3ac,1,.3)),-.1+sx*.48,2.52,sz*.38));
g.add(at(cylX(.13,.13,.4,20,M(0x15191e,.2,.7)),.55,2.17,0));g.add(at(cylX(.17,.17,.1,6,M(0x9aa3ac,1,.3)),.4,2.17,0));
g.add(new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3([new T.Vector3(.7,2.17,0),new T.Vector3(1.2,2.4,.1),new T.Vector3(2,2.9,.5),new T.Vector3(2.7,3.1,1.1)]),24,.075,8),M(0x111418,.1,.8)));reg("terminal",g,0,3);
// pés
g=G();m=M(0x1a528f,.55,.45);const hb=M(0x3b4450,.9,.4);

// base e campo
const base=at(bx(5.6,.14,4.2,M(0x242c35,.4,.7)),0,-1.81,0);base.receiveShadow=true;base.material.transparent=false;S.add(base);
const fld=G(),fm=new T.MeshBasicMaterial({color:0xc7ad72,transparent:true,opacity:.9,depthTest:false});
[-.7,0,.7].forEach(x=>{const a=new T.Mesh(new T.CylinderGeometry(.035,.035,1.7,10),fm),c=new T.Mesh(new T.ConeGeometry(.12,.3,14),fm);c.position.y=1;a.position.y=0;const p=G();p.add(a,c);p.position.x=x;p.renderOrder=10;a.renderOrder=c.renderOrder=10;fld.add(p)});fld.visible=false;S.add(fld);
// interface
const info=$("#info"),list=$("#list");let sel=null,hov=null;
Object.keys(D).forEach(id=>{const b=document.createElement("button");b.textContent=D[id].n.replace(/ \(.*\)/,"");b.dataset.id=id;b.onclick=()=>select(id===sel?null:id);list.appendChild(b)});
function select(id){sel=id;info.innerHTML=id?`<h2>${D[id].n}</h2><p>${D[id].f}</p><dl><dt>Material</dt><dd>${D[id].m}</dd><dt>Curiosidade</dt><dd>${D[id].c}</dd></dl>`:`<h2>Nenhuma peça selecionada</h2><p>Toque no motor ou escolha uma peça na lista abaixo.</p>`;

if(id){const bb=new T.Box3();D[id].g.forEach(q=>bb.expandByObject(q.o));bb.getCenter(tg);distG=Math.max(5.5,bb.getSize(new T.Vector3()).length()*1.5)}else{tg.set(0,.3,0);distG=baseD}}
// câmera
const tgt=new T.Vector3(0,.3,0),tg=new T.Vector3(0,.3,0);let th=.9,ph=1.25,dist=13,distG=13,baseD=13;
const ro=new ResizeObserver(()=>{const w=stage.clientWidth,h=stage.clientHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();baseD=w/h<1?19:13;if(!sel)distG=baseD});ro.observe(stage);
const pts=new Map();let moved=0;
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,e);moved=0;cv.style.cursor="grabbing"});

const rc=new T.Raycaster(),mp=new T.Vector2();

// controles
let on=!matchMedia("(prefers-reduced-motion:reduce)").matches,cur=0;
$("#pw").onclick=()=>{on=!on;$("#pw").textContent=on?"Desligar":"Ligar"};$("#pw").textContent=on?"Desligar":"Ligar";
$("#all").onclick=()=>{select(null);$("#ex").value=0;th=.9;ph=1.25};

// laço

spinners.forEach(s=>s.rotation.x=spin);cages.forEach(c=>c.rotation.x=spin*.42);fld.rotation.x=fa;
const et=$("#ex").value/100;ex+=(et-ex)*Math.min(1,dt*5);
