<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orçamento Metalúrgico - Sistema MVC</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <div class="imagem">
        <img src="https://elojr.com.br/wp-content/uploads/2020/10/destec.jpg" alt="Peça">
        <h3>Cálculo Técnico: Suporte XYZ</h3>
        <div id="display-tecnico">
            <p><strong>Volume:</strong> <span id="vol-res">0</span> mm³</p>
            <p><strong>Peso Estimado:</strong> <span id="peso-res">0</span> kg</p>
            <p id="rpm-info" style="font-size: 0.9em; margin-top: 10px; color: #22c55e;"></p>
        </div>
    </div>

    <div class="info-box">
        <h3>Geometria do Bruto</h3>
        <label for="diametro">Diâmetro (mm)</label>
        <input type="number" id="diametro" value="50" step="0.01">
        
        <label for="comprimento">Comprimento (mm)</label>
        <input type="number" id="comprimento" value="100" step="0.01">

        <label for="densidade">Material (Densidade g/cm³)</label>
        <select id="densidade">
            <option value="7.85">Aço Carbono (7.85)</option>
            <option value="2.70">Alumínio (2.70)</option>
            <option value="8.96">Cobre (8.96)</option>
        </select>

        <hr>
        <h3>Parâmetros de Corte</h3>
        <label for="vc">Velocidade de Corte (Vc - m/min)</label>
        <input type="number" id="vc" value="200">

        <label for="avanco">Avanço (f - mm/rotação)</label>
        <input type="number" id="avanco" value="0.2" step="0.01">

        <button id="btnCalcular">CALCULAR E SALVAR ORÇAMENTO</button>

        <h2 id="resultado">Custo Total: R$ 0.00</h2>
    </div>
</div>

<div class="container" style="margin-top: 20px; grid-template-columns: 1fr;">
    <div class="info-box">
        <h3>Histórico de Orçamentos (Salvos no Banco)</h3>
        <div id="lista-orcamentos">
            <p style="color: #94a3b8; font-style: italic;">Os cálculos salvos aparecem no console e no banco de dados.</p>
        </div>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
